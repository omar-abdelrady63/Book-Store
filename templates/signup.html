{% extends "base.html" %}

{% block title %}Create Account - Bookstore{% endblock %}

{% block content %}
<div class="auth-viewport">
  <!-- Ambient Background Orbs -->
  <div class="auth-ambient-orb auth-ambient-orb--1" aria-hidden="true"></div>
  <div class="auth-ambient-orb auth-ambient-orb--2" aria-hidden="true"></div>

  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-badge-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
          <circle cx="8.5" cy="7" r="4"></circle>
          <line x1="20" y1="8" x2="20" y2="14"></line>
          <line x1="23" y1="11" x2="17" y2="11"></line>
        </svg>
      </div>
      <h1 class="auth-title">Create Account</h1>
      <p class="auth-subtitle">Join Bookstore to explore, save, and order books</p>
    </div>

    <form method="POST" action="{{ url_for('main.signup') }}" novalidate>
      <div class="form-group">
        <label for="username" class="form-label">Choose a Username</label>
        <div class="input-wrapper">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          <input type="text" 
                 id="username" 
                 name="username" 
                 class="form-input has-icon" 
                 placeholder="e.g. alexander" 
                 required 
                 autofocus 
                 autocomplete="username">
        </div>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Create Password</label>
        <div class="input-wrapper">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <input type="password" 
                 id="password" 
                 name="password" 
                 class="form-input has-icon has-action" 
                 placeholder="At least 6 characters" 
                 required 
                 autocomplete="new-password">
          <button type="button" class="input-action-btn js-password-toggle" aria-label="Toggle password visibility">
            <svg class="icon-eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 16px; height: 16px;">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <svg class="icon-eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 16px; height: 16px; display: none;">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>
      </div>

      <div style="margin-top: var(--space-md);">
        <button type="submit" class="btn btn-primary btn-block" style="height: 48px; font-size: 1rem;">
          <span>Register Account</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 16px; height: 16px;">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </button>
      </div>
    </form>

    <div class="auth-footer">
      <span>Already have an account?</span>
      <a href="{{ url_for('main.login') }}">Return to Sign In</a>
    </div>
  </div>
</div>
{% endblock %}
